apiVersion: apps/v1
kind: Deployment
metadata:
  name: conforl-app
  namespace: conforl
  labels:
    app: conforl
    component: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: conforl
      component: app
  template:
    metadata:
      labels:
        app: conforl
        component: app
    spec:
      containers:
      - name: conforl
        image: conforl:latest
        ports:
        - containerPort: 8000
        env:
        - name: CONFORL_ENV
          value: "production"
        - name: CONFORL_LOG_LEVEL
          value: "INFO"
        - name: CONFORL_MAX_WORKERS
          value: "4"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
          readOnly: true
        - name: log-storage
          mountPath: /app/logs
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: conforl-models-pvc
      - name: log-storage
        persistentVolumeClaim:
          claimName: conforl-logs-pvc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
